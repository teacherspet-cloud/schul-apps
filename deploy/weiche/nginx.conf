# Weiche auf Port 443 und 80 (05.10.2026): EIN öffentlicher Port für Gywem Aviation und Schul-Apps.
#
# 443: nginx entschlüsselt mit dem Zertifikat des jeweiligen Namens und reicht weiter –
#      meineschulapps.de → Schul-Apps (127.0.0.1:8443), alles andere → Gywem Aviation (127.0.0.1:8787),
#      jeweils mit der ECHTEN Besucheradresse (X-Real-IP / X-Forwarded-For). Beide Server sperren
#      Fehlversuche je Adresse; eine reine Durchreiche hätte alle Besucher zu einer Adresse gemacht.
#      Gywem übernimmt die Adresse per VA_TRUST_PROXY (vorhandene Einstellung, Code unverändert),
#      Schul-Apps per SCHULAPPS_WEICHE=1.
#  80: meineschulapps.de beantwortet die Weiche selbst (ACME-Challenge aus Gywems acme-Ordner, sonst
#      Umleitung auf https://www.meineschulapps.de); alles andere geht unverändert an Gywems Umleiter (8788).
#
# Zertifikate: Gywem /gywem-tls/le.* (sein certbot-Hook), Schul-Apps /schulapps-tls/domain.*
# (deploy/vps/schul-apps-zertifikat.sh). Erneuerte Dateien liest nginx beim Neuladen alle 6 Stunden.
worker_processes 1;
events {
  worker_connections 2048;
}

http {
  server_tokens off;
  access_log off;
  # Uploads begrenzen die Server selbst
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_read_timeout 2h;
  proxy_send_timeout 2h;
  # Ereignisströme (SSE) und lange Aufträge sofort durchreichen
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_ssl_verify off;
  proxy_ssl_server_name on;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:tls:10m;

  map $http_upgrade $verbindung {
    default upgrade;
    '' '';
  }

  # ---------------------------------------------------------------- 443
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meineschulapps.de www.meineschulapps.de;
    ssl_certificate /schulapps-tls/domain.crt;
    ssl_certificate_key /schulapps-tls/domain.key;
    location / {
      proxy_pass https://127.0.0.1:8443;
      proxy_ssl_name $host;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $verbindung;
    }
  }
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    ssl_certificate /gywem-tls/le.crt;
    ssl_certificate_key /gywem-tls/le.key;
    location / {
      proxy_pass https://127.0.0.1:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      # WebSockets (Gywem: ws.js, Watch-Party, Benachrichtigungen)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $verbindung;
    }
  }

  # ---------------------------------------------------------------- 80
  server {
    listen 80;
    listen [::]:80;
    server_name meineschulapps.de www.meineschulapps.de;
    location /.well-known/acme-challenge/ {
      root /acme;
      default_type text/plain;
    }
    location / {
      return 301 https://www.meineschulapps.de$request_uri;
    }
  }
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    location / {
      proxy_pass http://127.0.0.1:8788;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
