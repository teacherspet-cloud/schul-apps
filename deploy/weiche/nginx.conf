# Weiche auf Port 443 und 80 (05.10.2026): EIN öffentlicher Port für Gywem Aviation und Schul-Apps.
#
# 443: nach dem Namen beim Verbindungsaufbau (SNI), OHNE die Verschlüsselung aufzubrechen –
#      meineschulapps.de → Schul-Apps (127.0.0.1:8443), alles andere → Gywem Aviation (127.0.0.1:8787).
#  80: meineschulapps.de beantwortet die Weiche selbst (ACME-Challenge aus Gywems acme-Ordner, sonst
#      Umleitung auf https://www.meineschulapps.de); alles andere geht unverändert an Gywems Umleiter (8788).
worker_processes 1;
events {
  worker_connections 1024;
}

stream {
  map $ssl_preread_server_name $ziel {
    meineschulapps.de schulapps;
    www.meineschulapps.de schulapps;
    default gywem;
  }
  upstream schulapps {
    server 127.0.0.1:8443;
  }
  upstream gywem {
    server 127.0.0.1:8787;
  }
  server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $ziel;
    proxy_connect_timeout 5s;
    # Lange Verbindungen (Ereignisströme, Abo-Anmeldung)
    proxy_timeout 2h;
  }
}

http {
  server_tokens off;
  access_log off;
  server {
    listen 80;
    listen [::]:80;
    server_name meineschulapps.de www.meineschulapps.de;
    location /.well-known/acme-challenge/ {
      root /acme;
      default_type text/plain;
    }
    location / {
      return 301 https://www.meineschulapps.de$request_uri;
    }
  }
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    location / {
      proxy_pass http://127.0.0.1:8788;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
