# Weiche auf Port 443/80 – neuer eigener Server (87.106.217.186, 09.10.2026), nur Schul-Apps.
# 443: entschlüsselt mit dem Zertifikat von meineschulapps.de und reicht mit der echten Besucheradresse an Schul-Apps
#      (127.0.0.1:8443) weiter. 80: ACME-Challenges aus /var/www/acme, sonst Umleitung auf https://www.meineschulapps.de.
worker_processes 1;
events {
  worker_connections 2048;
}

http {
  server_tokens off;
  access_log off;
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_read_timeout 2h;
  proxy_send_timeout 2h;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_ssl_verify off;
  proxy_ssl_server_name on;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:tls:10m;
  # Uebergangszeit: Der alte Server (217.154.120.64) reicht Anfragen weiter - dessen Besucheradresse uebernehmen
  set_real_ip_from 217.154.120.64;
  real_ip_header X-Real-IP;

  map $http_upgrade $verbindung {
    default upgrade;
    '' '';
  }

  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name meineschulapps.de www.meineschulapps.de;
    ssl_certificate /schulapps-tls/domain.crt;
    ssl_certificate_key /schulapps-tls/domain.key;
    location / {
      proxy_pass https://127.0.0.1:8443;
      proxy_ssl_name www.meineschulapps.de;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $verbindung;
    }
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    location /.well-known/acme-challenge/ {
      root /acme;
      default_type text/plain;
    }
    location / {
      return 301 https://www.meineschulapps.de$request_uri;
    }
  }
}
